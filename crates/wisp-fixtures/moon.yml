$schema: "https://moonrepo.dev/schemas/project.json"
language: rust
tasks:
  build: { script: "cargo build -p wisp-fixtures" }
  test: { script: "cargo test -p wisp-fixtures", deps: [build] }
  lint: { script: "cargo clippy -p wisp-fixtures --all-targets -- -D warnings" }
  format: { script: "cargo fmt --all" }
  format-check: { script: "cargo fmt --all --check" }
  audit: { script: "cargo deny check advisories" }
