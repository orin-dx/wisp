$schema: "https://moonrepo.dev/schemas/project.json"

language: rust

tasks:
  build:
    script: "cargo build -p wisp-model"
  test:
    script: "cargo test -p wisp-model"
    deps: [build]
  lint:
    script: "cargo clippy -p wisp-model --all-targets -- -D warnings"
  format:
    script: "cargo fmt --all"
  format-check:
    script: "cargo fmt --all --check"
  audit:
    script: "cargo deny check advisories"
