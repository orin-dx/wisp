# callisto configuration — see https://github.com/orin-dx/callisto
#
# Release order across the orin-dx repositories is human-tracked (Wisp D-024):
# michi → wisp-contracts → monokl → wisp. Within this repository Callisto orders
# the crates by their dependency graph.

[changesets]
dir = ".changeset"

[cascade]
mode = "out-of-range"
bump-severity = "patch"
peer-escalation = true

# Callisto names packages `cargo/<crate-name>`, not directory paths. Publish
# targets come from the manifests: the workspace carries `publish = false`, so
# nothing publishes until that flag is lifted per crate. wisp-fixtures is
# test-only and stays unpublished. Add `cargo/wisp-contracts` here when that
# crate lands in the workspace.

# Every crate inherits one workspace version; keep them on it.
[[fixed-group]]
name = "wisp"
members = ["cargo/wisp-model", "cargo/wisp-schema", "cargo/wisp-artifacts", "cargo/wisp-cli"]
